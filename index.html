<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite CGT Mobile</title>
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; margin: 0; }
        .header { background: #1a1a1a; color: #cc0000; text-align: center; padding: 25px 10px; border-bottom: 5px solid #cc0000; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 900; line-height: 1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { 
            background: white; border-radius: 15px; padding: 20px; text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-decoration: none; color: #333;
            border: 1px solid #ddd; transition: 0.2s;
        }
        .card:active { background: #fffafa; border-color: #cc0000; transform: scale(0.95); }
        .card img { width: 55px; height: 55px; margin-bottom: 10px; }
        .card span { font-weight: bold; font-size: 14px; display: block; }
        .footer { text-align: center; color: #888; font-size: 11px; padding: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NI NOS DOMARON</h1>
        <h1>NI NOS DOMARÁN</h1>
    </div>

    <div class="grid">
        <a href="tools/estres_calor.html" class="card">
            <img src="icons/icono_1.png" alt="">
            <span>Estrés Calor</span>
        </a>
        <a href="tools/desbrozadora.html" class="card">
            <img src="icons/icono_desbroz.png" alt="">
            <span>Desbrozadora</span>
        </a>
    </div>

    <div class="footer">© 2024 CGT - Herramientas de Prevención</div>
</body>
</html>
