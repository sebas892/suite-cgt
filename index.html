<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite CGT Mobile</title>
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; margin: 0; padding-bottom: 50px; }
        .header { background: #1a1a1a; color: #cc0000; text-align: center; padding: 25px 10px; border-bottom: 5px solid #cc0000; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; line-height: 1.1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { 
            background: white; border-radius: 15px; padding: 15px; text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-decoration: none; color: #333;
            border: 1px solid #ddd; display: flex; flex-direction: column; align-items: center;
        }
        .card img { width: 60px; height: 60px; margin-bottom: 10px; object-fit: contain; }
        .card span { font-weight: bold; font-size: 13px; display: block; }
    </style>
</head>
<body>
    <div class="header"><h1>NI NOS DOMARON</h1><h1>NI NOS DOMARÁN</h1></div>
    <div id="tools-grid" class="grid"></div>

    <script>
        fetch('Config.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('tools-grid');
                data.forEach(tool => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = `tools/${tool.archivo}`;
                    // Usamos la ruta absoluta de GitHub para evitar fallos de carga
                    const iconPath = `icons/${tool.icono}`;
                    card.innerHTML = `<img src="${iconPath}"><span>${tool.nombre}</span>`;
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
